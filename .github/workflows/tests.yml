# Runs the normal test suite on every push and pull request.
# Ollama is NOT available on GitHub's machines, so the `ollama` integration
# tests are skipped automatically (see pytest.ini: addopts = -m "not ollama").
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (no Ollama needed)
        run: pytest
